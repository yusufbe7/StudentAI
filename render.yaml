# Render Blueprint — "New → Blueprint" orqali bitta tugma bilan yaratish
# Bepul tarif: 15 daqiqa so'rov bo'lmasa uxlaydi, disk o'chadi → ma'lumotlar
# SYNC_DATABASE_URL (Neon Postgres) orqali saqlanadi. Batafsil: DEPLOY_RENDER.md
services:
  - type: web
    name: studentai-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PANEL_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
